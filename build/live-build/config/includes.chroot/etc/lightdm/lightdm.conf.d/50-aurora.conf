# AURORA OS graphical login.
# Autologin is intentionally disabled so the branded greeter is the first
# thing a user sees. The live account and its password are set up by
# aurora-live-password.service before LightDM starts.
[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
allow-guest=false
greeter-allow-guest=false
allow-empty-passwords=true
greeter-hide-users=false
# LightDM's default includes -novtswitch, which can leave the greeter on an
# inactive VT (KI-027). Let X activate its own VT instead. -dpms keeps the
# greeter and the session from blanking the framebuffer after 10 idle minutes
# (KI-024).
xserver-command=X -nolisten tcp -dpms -s 0
display-setup-script=/usr/local/bin/aurora-display-setup
