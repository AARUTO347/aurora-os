# casper's initramfs stage (casper-bottom/15autologin) appends
# autologin-user=ubuntu to /etc/lightdm/lightdm.conf. This drop-in is read
# after that file, so it wins and the branded greeter stays the first thing a
# user sees. aurora-identity.service also strips the injected keys.
[Seat:*]
autologin-user=
autologin-user-timeout=0
