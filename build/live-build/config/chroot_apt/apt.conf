// This build environment's network returns 403 for apt's default User-Agent,
// so the chroot needs the same override the WSL host uses. Only the UA string
// changes; TLS verification and archive signatures are untouched.
Acquire::http::User-Agent "Mozilla/5.0 (X11; Linux x86_64) apt";
Acquire::https::User-Agent "Mozilla/5.0 (X11; Linux x86_64) apt";
